name: Validate Example Payloads

# Calls tools/validate-examples.sh. It did not, and that was the defect.
#
# This job used to carry ~90 lines of inline Node while a script of the same name sat in tools/
# doing the same work differently and worse. Two implementations of one gate, of which CI ran
# the one that could not be reproduced locally — so the script rotted unnoticed (an unquoted
# $REFS word-splitting a glob into 22 paths after a single -r, and npx resolving to the ajv
# *library*) and reported 52 failures out of 52 to anyone who tried it. Its content was clean
# the entire time.
#
# The script now carries the three properties this job had and the script did not: every schema
# loaded as a ref, an absent pair counted rather than silently skipped, and a refusal to report
# success for zero work.
#
# One difference the other way, which the merge KEEPS rather than drops: the script checks
# examples/payloads/http/provisioning.request.json against schemas/provisioning-request.schema.json.
# The inline version never did. So the pair that only the unrun script covered is now the pair
# CI covers — 52 checked here, against 51 before.

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/payloads/**'
      - 'tools/validate-examples.sh'
      - '.github/workflows/validate-examples.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/payloads/**'
      - 'tools/validate-examples.sh'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Installed OUTSIDE the checkout, deliberately, and the script reads AJV_BIN so it can be.
      # Installing into the repo makes this job read package.json, whose only dependency is
      # @ospp/protocol — a package this gate never loads. A version cascade once pinned that to
      # ^0.8.0, a version npm has never carried (0.7.0 is followed by 0.9.0), and from then on
      # the install failed ETARGET before a single payload was checked.
      - name: Install ajv-cli
        run: npm install --no-save --prefix "$RUNNER_TEMP/gate" ajv-cli@5 ajv-formats@3

      - name: Validate every example payload against its schema
        env:
          AJV_BIN: ${{ runner.temp }}/gate/node_modules/.bin/ajv
        run: bash tools/validate-examples.sh
