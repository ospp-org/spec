name: Validate Test Vectors

on:
  push:
    paths:
      - 'conformance/test-vectors/**'
      - 'schemas/**'
  pull_request:
    paths:
      - 'conformance/test-vectors/**'
      - 'schemas/**'

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate test vectors (0-skip enforced)
        run: |
          # Real validator: checks every vector under conformance/test-vectors/**
          # against its schema (no args, cwd-independent, stdlib + jsonschema only).
          # It exits nonzero on any FAIL, but a vector that can't be mapped to a
          # schema is counted as SKIP, not FAIL — so a discovery gap would NOT by
          # itself make the script exit nonzero. Guard against that vacuity
          # explicitly: the job must also fail if any vector was skipped.
          out=$(python3 tools/verify-schemas.py) || rc=$?
          rc="${rc:-0}"
          echo "$out"

          if [ "$rc" -ne 0 ]; then
            echo "::error::verify-schemas.py exited $rc — FAIL(s) present (see output above)"
            exit "$rc"
          fi

          if echo "$out" | grep -q '^SKIP'; then
            echo "::error::validator reported SKIP line(s) — a vector could not be mapped to a schema (discovery gap)"
            exit 1
          fi

          if ! echo "$out" | grep -qE '0 SKIP'; then
            echo "::error::validator summary does not confirm 0 SKIP — discovery gap"
            exit 1
          fi

          echo "Non-vacuity check passed: exit $rc, 0 SKIP — all vectors mapped and validated"
