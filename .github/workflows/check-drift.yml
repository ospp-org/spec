name: Check Drift

# Four checks for the class "prose asserts a property and nothing establishes it".
#
# A gate in tools/ that no job runs is the same defect one level up, so this workflow
# exists to be that caller. Each script is a ratchet: it prints every finding on every
# run and fails only when the count rises above the baseline recorded in the script.
#
# Paths are deliberately broad. check-config-defaults reads restatements out of
# conformance/ and examples/ as well as spec/ — one of the three real findings it caught
# on its first run was a conformance case citing Chapter 08 while contradicting it — so
# narrowing this trigger to spec/ would reintroduce exactly the gap it was written for.

on:
  push:
    paths:
      - '**/*.md'
      - 'schemas/**'
      - 'tools/check-*.py'
      - 'tools/verify-test-nonces.mjs'
      - 'tools/check-tool-callers.py'
      - '.github/workflows/**'
      - '.github/workflows/check-drift.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'schemas/**'
      - 'tools/check-*.py'
      - 'tools/verify-test-nonces.mjs'
      - 'tools/check-tool-callers.py'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # verify-test-nonces.mjs is stdlib-only Node, like the Python checks above are
      # stdlib-only Python — nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # stdlib only, by design — nothing to install, nothing that can ETARGET the way
      # validate-examples did when a version cascade pointed package.json at a version
      # npm had never carried.

      - name: Restated configuration defaults vs the Chapter 08 registry
        run: python3 tools/check-config-defaults.py

      - name: Schema descriptions asserting conditionals the schema does not enforce
        run: python3 tools/check-schema-conditionals.py

      - name: Normative keywords not bolded
        run: python3 tools/check-normative-bold.py

      # Reads schemas/ as well as the markdown: check D compares a registry range against
      # the JSON Schema bounds of the wire field carrying the same quantity, so a schema
      # edit alone can move this result. That is why 'schemas/**' is in the triggers above.
      - name: Chapter 08 Range column, §9 against §§2--6, and restated ranges
        run: python3 tools/check-config-ranges.py

      # A nonce is schema-valid whatever its value, so nothing else can see this: one
      # appNonce/stationNonce pair had reached four documents depicting four different
      # handshakes, while ble-handshake.md §4.2.2 rests the claim-layer replay defence on
      # them never being reused. Derived from a per-handshake label, and checked for
      # cross-document reuse.
      - name: Handshake nonces are derived from their labels and unique per document
        run: node tools/verify-test-nonces.mjs

      # The check with no signal of its own. A gate that verifies the wrong thing still emits a
      # verdict; a gate nothing starts emits nothing at all, so it can only be found by
      # subtracting the set of callers from the set of tools. On the run that introduced this,
      # NINE gates were unreachable from any job — including the whole signed-conformance guard.
      # Triggers include .github/workflows/** so that deleting a caller fails here.
      - name: Every gate in tools/ is reachable from some job
        run: python3 tools/check-tool-callers.py --list
